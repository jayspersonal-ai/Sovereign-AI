global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:8500"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "dcgm"
    static_configs:
      - targets: ["dcgm-exporter:8502"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8503"]

  - job_name: "litellm"
    metrics_path: "/metrics/"
    authorization:
      type: Bearer
      credentials: "sk-local-dev-key"
    static_configs:
      - targets: ["litellm:8400"]
